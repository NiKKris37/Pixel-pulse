name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Tests unitaires
        run: node --test tests/*.test.mjs

      - name: Créer le projet
        run: |
          cd "$RUNNER_TEMP"
          npx --yes create-expo-app@latest pixel-pulse --template blank@sdk-58
          cp -r "$GITHUB_WORKSPACE/App.js" "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/modules" pixel-pulse/
          cp "$GITHUB_WORKSPACE"/assets/*.png pixel-pulse/assets/

      - name: Installer les modules
        run: |
          cd "$RUNNER_TEMP/pixel-pulse"
          npx expo install expo-battery expo-device expo-file-system expo-haptics expo-intent-launcher expo-media-library expo-network expo-splash-screen expo-status-bar expo-system-ui expo-video react-native-safe-area-context react-native-svg

      - name: Configurer l'application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd "$RUNNER_TEMP/pixel-pulse"
          node "$GITHUB_WORKSPACE/scripts/configurer.js"

      - name: Compiler l'APK pour le Pixel
        run: |
          cd "$RUNNER_TEMP/pixel-pulse"
          npx expo prebuild --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pixel-pulse.apk"

      # Clé personnelle si les deux secrets existent, sinon clé de test d'origine
      - name: Signer et vérifier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert() { "$signer" verify --print-certs "$1" | grep -m1 'SHA-256 digest' | awk '{print $NF}'; }
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cle.p12"
            bash scripts/signer.sh "$RUNNER_TEMP/pixel-pulse.apk" "$RUNNER_TEMP/cle.p12"
            rm "$RUNNER_TEMP/cle.p12"
            echo "SIGNATURE=clé personnelle" >> "$GITHUB_ENV"
          else
            gh release download v1-1 -p pixel-pulse.apk -D "$RUNNER_TEMP/v1"
            old=$(cert "$RUNNER_TEMP/v1/pixel-pulse.apk"); new=$(cert "$RUNNER_TEMP/pixel-pulse.apk")
            echo "v1=$old"; echo "nouveau=$new"
            test -n "$old" && test "$old" = "$new"
            echo "SIGNATURE=clé de test" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK pour l'émulateur
        run: |
          cd "$RUNNER_TEMP/pixel-pulse/android"
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/essai.apk"

      # Vérifie la commande de signature avec une clé jetable
      - name: Signer l'APK d'essai
        env:
          KEYSTORE_PASSWORD: essai-jetable
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/essai.p12" -storetype PKCS12 -alias pixelpulse \
            -keyalg RSA -keysize 2048 -validity 2 -storepass "$KEYSTORE_PASSWORD" -dname CN=essai
          bash scripts/signer.sh "$RUNNER_TEMP/essai.apk" "$RUNNER_TEMP/essai.p12"

      - name: Préparer l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
          curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Essayer l'application sur un émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          script: bash tests/essai.sh

      - name: Conserver les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}-${{ github.run_attempt }}" "$RUNNER_TEMP/pixel-pulse.apk" \
            --target "$GITHUB_SHA" \
            --title "Pixel Pulse 3.0.${{ github.run_number }}" \
            --notes "Aperçu, doublons, historique batterie, test de connexion, température et widget. Signature : $SIGNATURE."
